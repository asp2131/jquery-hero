<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script type="module">
import { lessons } from "/src/lessons.js";
import { runExercise } from "/src/runner.js";
const mutants = {
  12: [['  } else {\n    $("#hero").text("Unsupported");\n  }', "  }"]],
  13: [['hp < 30) {\n    $("#hero").text("Critical");\n  } else if (hp < 70) {\n    $("#hero").text("Wounded")', 'hp < 70) {\n    $("#hero").text("Wounded");\n  } else if (hp < 30) {\n    $("#hero").text("Critical")']],
  14: [['word !== "moonbeam"', 'word.toLowerCase() !== "moonbeam"']],
  15: [["function dodgeRoll() {\n  if (Math.random() > 0.5)", "const roll = Math.random();\nfunction dodgeRoll() {\n  if (roll > 0.5)"]],
  16: [["  shieldUp = !shieldUp;\n", "  shieldUp = true;\n"]],
  17: [["hasRedKey && hasBlueKey", "hasRedKey || hasBlueKey"]],
  18: [["level >= 5", "level > 5"], ["level >= 5 || hasBadge", "level >= 5 && hasBadge"]],
  19: [["hasKey && (level >= 5 || hasBadge)", "hasKey && level >= 5 || hasBadge"]],
  20: [['  if (arrows) {\n    arrows -= 1;', '  arrows -= 1;\n  if (arrows >= 0) {']],
  21: [['$("#message").text("Welcome, " + name)', '$("#message").text("Welcome " + name)']],
  22: [['result === "Heads" ? "gold"', 'Math.random() > 0.5 ? "gold"']],
  23: [
    ["a.x < bRight && aRight > b.x", "a.x <= bRight && aRight >= b.x"],
    [" && a.y < bBottom && aBottom > b.y", ""],
    ["a.x < bRight && ", ""],
    [" && aBottom > b.y", ""],
  ],
};
const lines = [];
const passes = (r) => !r.error && r.tests.every((t) => t.passed);
const out = document.getElementById("out");
for (const lesson of lessons) {
  out.textContent = lines.join("\n") + `\n...lesson ${lesson.id}`;
  const sol = await runExercise(lesson, lesson.solution);
  const start = await runExercise(lesson, lesson.starter);
  const bad = sol.tests.filter((t) => !t.passed).map((t) => `${t.label}: ${t.detail}`);
  lines.push(`${passes(sol) ? "ok  " : "FAIL"} ${lesson.id} solution ${sol.error || ""} ${bad.join(" | ")}`);
  lines.push(`${passes(start) ? "FAIL" : "ok  "} ${lesson.id} starter fails ${start.tests.filter((t) => t.passed).length}/${start.tests.length} pass`);
  for (const [from, to] of mutants[lesson.id] || []) {
    if (!lesson.solution.includes(from)) { lines.push(`FAIL ${lesson.id} mutant pattern missing: ${from}`); continue; }
    const r = await runExercise(lesson, lesson.solution.replace(from, to));
    lines.push(`${passes(r) ? "FAIL" : "ok  "} ${lesson.id} mutant caught: ${to.slice(0, 40).replace(/\n/g, " ")}`);
  }
}
document.getElementById("out").textContent = lines.join("\n") + "\nDONE";
</script>
