<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132e2c" />
    <meta
      name="description"
      content="Learn real jQuery by writing code, passing tests, and bringing a pixel-art island back to life."
    />
    <title>jQuery Quest — Code a little. Discover a lot.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;650;700;750&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <a class="brand" href="./" aria-label="jQuery Quest home"
          ><span class="brand-mark">$<span>_</span></span
          ><span>jQuery<span class="brand-light">Quest</span></span></a
        >
        <div class="header-progress" title="Quests complete">
          <div class="progress-track"><span id="progress-fill"></span></div>
          <strong id="progress-value">0 / 12</strong>
          <span class="crystal-count" title="Crystals found"
            ><span class="crystal-icon"></span
            ><span id="crystal-value">0</span></span
          >
        </div>
        <div class="header-actions">
          <button id="guide-button" class="nav-item">Guide</button>
          <button
            id="sound-button"
            class="icon-button"
            aria-label="Enable game sounds"
            aria-pressed="false"
            title="Enable game sounds"
          >
            ♫<span class="sound-off">×</span>
          </button>
        </div>
      </header>
      <main class="workspace">
        <section class="adventure-column" aria-label="Island adventure">
          <div class="world-card">
            <div class="world-actions">
              <button id="map-button" title="Open quest map">Quests</button
              ><button id="explore-button" aria-pressed="false">
                Explore island
              </button>
            </div>
            <canvas
              id="world"
              tabindex="0"
              role="img"
              aria-label="Interactive isometric island. Enable Explore, then use arrow keys or WASD to move, or click a tile."
            ></canvas>
            <div class="world-tip" id="world-tip" hidden>
              Click a tile or use WASD / arrows. Follow the gold crystals.
            </div>
            <div class="movement-controls" id="movement-controls" hidden>
              <button data-direction="up" aria-label="Move up">↑</button>
              <div>
                <button data-direction="left" aria-label="Move left">←</button
                ><button data-direction="down" aria-label="Move down">
                  ↓</button
                ><button data-direction="right" aria-label="Move right">
                  →
                </button>
              </div>
            </div>
          </div>
          <article class="mission-card">
            <h2 id="mission-title">Wake the beacon</h2>
            <p class="mission-description" id="mission-description"></p>
            <ul class="objectives" id="objectives"></ul>
            <details class="guide-note">
              <summary>
                <span class="guide-avatar" aria-hidden="true"></span>
                How does this work?
              </summary>
              <p id="guide-note"></p>
              <small
                ><span id="mission-number">QUEST 01</span> ·
                <span id="mission-concept"></span> ·
                <a id="slides-link" target="_blank" rel="noopener"
                  ><span id="source-label"></span> ↗</a
                ></small
              >
            </details>
            <button id="hint-button" class="hint-button">Need a hint?</button>
            <div id="hint-panel" class="hint-panel" hidden>
              <div id="hint-content"></div>
              <div class="hint-actions">
                <button id="next-hint">Another hint</button
                ><button id="solution-button">Show example solution</button>
              </div>
            </div>
          </article>
        </section>
        <section class="code-column" aria-label="Code exercise">
          <div class="editor-card">
            <div class="editor-tabs" role="tablist" aria-label="Exercise files">
              <button
                id="tab-js"
                class="selected"
                role="tab"
                aria-selected="true"
                aria-controls="panel-js"
              >
                quest.js</button
              ><button
                id="tab-html"
                role="tab"
                aria-selected="false"
                aria-controls="panel-html"
              >
                index.html</button
              ><button
                id="tab-preview"
                role="tab"
                aria-selected="false"
                aria-controls="panel-preview"
              >
                Preview</button
              ><button
                id="reset-code"
                class="reset-code"
                aria-label="Reset code to starter"
                title="Reset code to starter"
              >
                ↺
              </button>
            </div>
            <div
              id="panel-js"
              class="code-panel"
              role="tabpanel"
              aria-labelledby="tab-js"
            >
              <div id="editor"></div>
            </div>
            <div
              id="panel-html"
              class="code-panel html-panel"
              role="tabpanel"
              aria-labelledby="tab-html"
              hidden
            >
              <div class="readonly-label">Read only</div>
              <pre id="html-source"></pre>
            </div>
            <div
              id="panel-preview"
              class="code-panel preview-panel"
              role="tabpanel"
              aria-labelledby="tab-preview"
              hidden
            >
              <div class="readonly-label">Run your code to update</div>
              <iframe
                id="dom-preview"
                title="Exercise DOM result"
                sandbox=""
                referrerpolicy="no-referrer"
              ></iframe>
            </div>
            <div class="test-section" id="test-section" hidden>
              <p id="run-caption" class="run-caption"></p>
              <div id="test-results" aria-live="polite"></div>
              <div id="run-error" class="run-error" role="alert" hidden></div>
            </div>
            <div class="run-section">
              <button id="run-button" class="run-button" title="⌘/Ctrl + Enter">
                <span class="play-icon">▶</span
                ><span id="run-label">Run code</span></button
              ><button id="continue-button" class="continue-button" hidden>
                On to the next quest <span>→</span>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="game-dialog">
      <div class="dialog-heading">
        <div>
          <div id="dialog-eyebrow" class="eyebrow"></div>
          <h2 id="dialog-title"></h2>
        </div>
        <button
          id="close-dialog"
          class="dialog-close"
          aria-label="Close dialog"
        >
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
