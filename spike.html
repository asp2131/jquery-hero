<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diorama spike · Quest 1</title>
    <style>
      body { margin: 0; display: grid; grid-template-columns: 360px 1fr; height: 100vh; font: 14px system-ui, sans-serif; background: #172522; color: #e6ecdf; }
      aside { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
      textarea { flex: 1; resize: none; padding: 12px; border: 0; border-radius: 8px; background: #0f1a18; color: #d3f68e; font: 13px/1.7 "DM Mono", monospace; }
      button { padding: 10px; border: 0; border-radius: 8px; background: #d3f68e; color: #172522; font-weight: 700; cursor: pointer; }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <aside>
      <strong>Quest 1 · Wake the beacon</strong>
      <textarea id="code" spellcheck="false"></textarea>
      <button id="run">Run code</button>
    </aside>
    <iframe id="world" sandbox="allow-scripts" title="Island"></iframe>
    <script type="module">
      import { lessons } from "./src/lessons.js";
      import { buildWorldDoc } from "./src/world-dom.js";
      const lesson = lessons[0];
      const code = document.getElementById("code");
      const world = document.getElementById("world");
      code.value = lesson.solution;
      world.srcdoc = buildWorldDoc(lesson, "", 0);
      document.getElementById("run").onclick = () => (world.srcdoc = buildWorldDoc(lesson, code.value));
    </script>
  </body>
</html>
